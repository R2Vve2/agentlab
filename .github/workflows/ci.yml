name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (includes MCP server test)
        run: pytest
      - name: Scripted evaluation suite (offline)
        run: python -m agentlab eval --min-pass-rate 1.0
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentlab:ci .
      - name: Container runs the eval suite
        run: docker run --rm agentlab:ci python -m agentlab eval --min-pass-rate 1.0
      - name: Web server smoke test
        run: |
          docker run -d --name agentlab -p 8000:8000 agentlab:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf -X POST http://localhost:8000/api/replay -H 'Content-Type: application/json' -d '{"task_id":"order_total_check"}' | grep -q '"passed":true'
