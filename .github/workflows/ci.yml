name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (includes MCP server test)
        run: pytest
      - name: Scripted evaluation suite (offline)
        run: python -m agentlab eval --min-pass-rate 1.0
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentlab:ci .
      - name: Container runs the eval suite
        run: docker run --rm agentlab:ci
